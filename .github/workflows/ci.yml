name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # npm ci (bukan npm install): gagal keras bila lockfile tidak sinkron.
      # --ignore-scripts: skip download Chromium Puppeteer, test tidak butuh browser.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Syntax check all files
        run: |
          for f in bin/*.mjs src/*.mjs src/**/*.mjs test/*.mjs; do
            node --check "$f" || exit 1
          done

      - name: Run tests
        run: npm test

      - name: CLI help check
        run: node bin/cutad.mjs --help

      - name: CLI version check
        run: node bin/cutad.mjs --version
